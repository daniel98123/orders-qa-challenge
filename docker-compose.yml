services:
  api:
    build: .
    image: challenge-api
    container_name: orders-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  web:
    build: ./frontend
    image: challenge-web
    container_name: orders-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
