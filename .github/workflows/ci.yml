name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=3

jobs:
  # ------------------------------------------------------------------
  # 1. Build + pruebas + quality gates de la API
  # ------------------------------------------------------------------
  api-quality:
    name: API · build, pruebas y quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Pruebas unitarias + cobertura (gate líneas/ramas >= 80%)
        # jacoco:check está ligado a la fase test: falla si la cobertura baja del umbral
        run: mvn -B -ntp test

      - name: Mutation testing (gate mutation score >= 70%)
        run: mvn -B -ntp org.pitest:pitest-maven:mutationCoverage

      - name: Pruebas de aceptación Karate
        run: mvn -B -ntp failsafe:integration-test failsafe:verify

      - name: Resumen de quality gates
        if: always()
        run: python3 .github/scripts/quality_summary.py

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-reports
          path: |
            target/site/jacoco/
            target/pit-reports/
            target/karate-reports/
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

  # ------------------------------------------------------------------
  # 2. Plus IA: matriz de trazabilidad RN -> pruebas (gate: toda RN probada)
  # ------------------------------------------------------------------
  traceability:
    name: Trazabilidad de requisitos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pruebas de la herramienta
        run: python -m unittest discover -s ai-tools/traceability/tests -v
      - name: Generar matriz y verificar cobertura de reglas
        run: python ai-tools/traceability/traceability.py --out target/traceability --fail-on-gaps
      - name: Resumen
        if: always()
        run: cat target/traceability/traceability.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traceability
          path: target/traceability/

  # ------------------------------------------------------------------
  # 3. Imagen Docker + smoke Karate contra el contenedor + E2E Playwright
  # ------------------------------------------------------------------
  docker-e2e:
    name: Docker · imagen, smoke y E2E
    needs: api-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir imagen Docker de la API
        run: docker build -t challenge-api:${{ github.sha }} -t challenge-api:latest .

      - name: Levantar stack (API + frontend)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Smoke Karate contra el contenedor
        run: >
          mvn -B -ntp test-compile failsafe:integration-test failsafe:verify
          -Dkarate.baseUrl=http://localhost:8080
          "-Dkarate.options=--tags @smoke"

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Pruebas E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: 'true'
        run: npx playwright test

      - name: Logs de contenedores
        if: always()
        run: docker compose logs --no-color > docker-logs.txt

      - name: Publicar reportes E2E y logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/
            target/karate-reports/
            docker-logs.txt
          retention-days: 14

      - name: Apagar stack
        if: always()
        run: docker compose down -v
